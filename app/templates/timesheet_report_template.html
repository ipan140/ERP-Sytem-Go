<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Timesheet Report</title>
<style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .header { border-bottom: 2px solid #2980b9; padding-bottom: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
    th { background-color: #3498db; color: white; }
</style></head><body>
    <div class="header"><h2>TIMESHEET REPORT</h2><p>Project: {{.ProjectName}} | Consultant: {{.ConsultantName}}</p></div>
    <table>
        <tr><th>Date</th><th>Task Description</th><th>Hours</th><th>Billable</th></tr>
        {{range .Entries}}<tr><td>{{.Date}}</td><td>{{.Task}}</td><td>{{.Hours}}</td><td>{{.IsBillable}}</td></tr>{{end}}
        <tr><td colspan="2" style="text-align:right; font-weight:bold;">Total Hours:</td><td colspan="2"><strong>{{.TotalHours}}</strong></td></tr>
    </table>
</body></html>
