<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Financial Report</title>
<style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .header { text-align: center; border-bottom: 2px solid #34495e; padding-bottom: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #ecf0f1; } .summary { font-weight: bold; background-color: #dcdde1; }
</style></head><body>
    <div class="header"><h2>{{.ReportName}}</h2><p>Period: {{.Period}}</p></div>
    <table>
        <tr><th>Account</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>
        {{range .Accounts}}<tr><td>{{.AccountName}}</td><td>Rp {{.Debit}}</td><td>Rp {{.Credit}}</td><td>Rp {{.Balance}}</td></tr>{{end}}
        <tr class="summary"><td colspan="3" style="text-align:right;">Net Total:</td><td>Rp {{.NetTotal}}</td></tr>
    </table>
</body></html>
