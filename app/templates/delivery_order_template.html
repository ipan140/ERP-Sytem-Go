<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Delivery Order</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #ffc107; padding-bottom: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #000; text-align: center; }
        th { background-color: #eee; }
        .signatures { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
        .sign-box { width: 30%; border-top: 1px solid #000; padding-top: 5px; margin-top: 80px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>DELIVERY ORDER</h2>
            <p><strong>DO No:</strong> {{.DONumber}}</p>
            <p><strong>Date:</strong> {{.Date}}</p>
        </div>
        <div style="text-align: right;">
            <p><strong>Deliver To:</strong><br>{{.CustomerName}}<br>{{.Address}}</p>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Item Code</th>
                <th>Description</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            {{range ,  := .Items}}
            <tr>
                <td>{{}}</td>
                <td>{{.Code}}</td>
                <td style="text-align: left;">{{.Name}}</td>
                <td>{{.Qty}} {{.UOM}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>
    <div class="signatures">
        <div>
            <div class="sign-box">Prepared By</div>
        </div>
        <div>
            <div class="sign-box">Driver / Courier</div>
        </div>
        <div>
            <div class="sign-box">Received By</div>
        </div>
    </div>
</body>
</html>
