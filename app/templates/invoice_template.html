<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Invoice</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 30px; color: #333; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px; }
        .company-name { font-size: 24px; font-weight: bold; color: #0056b3; }
        .invoice-details { text-align: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
        .total-row { font-weight: bold; font-size: 18px; }
        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="header">
        <div class="company-name">ERP Company Ltd.</div>
        <div class="invoice-details">
            <h2>INVOICE</h2>
            <p><strong>No:</strong> {{.InvoiceNumber}}</p>
            <p><strong>Date:</strong> {{.Date}}</p>
        </div>
    </div>
    <div class="billing-info">
        <h3>Billed To:</h3>
        <p>{{.CustomerName}}<br>{{.CustomerAddress}}</p>
    </div>
    <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {{range .Items}}
            <tr>
                <td>{{.Description}}</td>
                <td>{{.Qty}}</td>
                <td>Rp {{.UnitPrice}}</td>
                <td>Rp {{.Total}}</td>
            </tr>
            {{end}}
            <tr class="total-row">
                <td colspan="3" style="text-align: right;">Grand Total:</td>
                <td>Rp {{.GrandTotal}}</td>
            </tr>
        </tbody>
    </table>
    <div class="footer">
        <p>Thank you for your business!</p>
    </div>
</body>
</html>
