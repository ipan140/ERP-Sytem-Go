<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Work Order</title>
<style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .header { border-bottom: 3px solid #d35400; padding-bottom: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; border: 1px solid #000; text-align: left; }
    th { background-color: #e67e22; color: white; }
</style></head><body>
    <div class="header"><h2>WORK ORDER (MANUFACTURING)</h2><p>WO No: {{.WONumber}} | Target Date: {{.TargetDate}}</p></div>
    <p><strong>Product to Manufacture:</strong> {{.ProductName}} (Qty: {{.Quantity}})</p>
    <h3>Bill of Materials (BOM)</h3>
    <table>
        <tr><th>Raw Material</th><th>Required Qty</th><th>Location</th></tr>
        {{range .BOM}}<tr><td>{{.Material}}</td><td>{{.Qty}} {{.UOM}}</td><td>{{.Location}}</td></tr>{{end}}
    </table>
</body></html>
